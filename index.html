     first paint uses. It has to carry the Hant subtag for the same reason
     main.tsx does — see the note there and on --font-sans in index.css. -->
<html lang="zh-Hant-TW" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/parley.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Parley</title>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
