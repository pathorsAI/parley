name: Android CI

# Pre-merge gate for the Android app, for the same reason ios-ci.yml exists:
# `ci.yml` skips `android/**` entirely, so until this file landed the Kotlin
# sources were first compiled by `android-release.yml` — on a pushed
# `android-v*` tag, with a Play upload waiting behind it. A compile error cost a
# tag. Now it costs a red check.
#
# Deliberately NOT the release workflow: no keystore, no Play credentials, a
# debug build only. It proves the app compiles and the unit tests pass, which is
# everything a reviewer needs and nothing that needs a secret — so it is safe on
# pull requests from forks.

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      # The kit's and the app's tests read this folder (AnnouncementCatalogTest,
      # AnnouncementStoreTest), and the app bundles it.
      - "announcements/**"
      # HandoffStringsParityTest compares Android's strings with iOS's catalog.
      - "ios/App/Parley/Localizable.xcstrings"
      - ".github/workflows/android-ci.yml"
  pull_request:
    paths:
      - "android/**"
      - "announcements/**"
      - "ios/App/Parley/Localizable.xcstrings"
      - ".github/workflows/android-ci.yml"

# A force-push mid-review should not leave the superseded run burning minutes.
concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build app + test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # `packages` as in android-release.yml: the action's default includes
      # `tools`, which Google has withdrawn from the SDK repository.
      - name: Set up the Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      # parleykit is pure JVM and the app's unit tests are Robolectric-free, so
      # both are cheap. StringsParityTest is among them: a string added to one
      # locale and not the other fails here.
      - name: Test
        working-directory: android
        run: ./gradlew :parleykit:test :app:testDebugUnitTest

      # Unsigned debug build: compiles every source set the tests above do not
      # reach (Compose UI, resources, the manifest).
      - name: Build
        working-directory: android
        run: ./gradlew assembleDebug
