name: CI

# Pre-merge gate for the desktop app: the frontend typecheck + unit tests that
# CLAUDE.md already requires before every PR, plus a Rust compile check on both
# desktop targets. The Windows job exists to keep the codebase building for the
# Windows port even before any Windows-specific feature lands — native build
# regressions (audiopus_sys, knf-rs-sys, cfg-gated code) surface here instead of
# at release time.

on:
  push:
    branches: [main]
    paths-ignore:
      - "android/**"
      - "ios/**"
      - "website/**"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "android/**"
      - "ios/**"
      - "website/**"
      - "docs/**"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend typecheck + tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install frontend dependencies
        # --ignore-scripts blocks supply-chain attacks via package lifecycle
        # scripts, matching the release workflow.
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Typecheck
        # Local node_modules binaries (installed from the frozen lockfile) —
        # no ad-hoc registry resolution.
        run: bun run tsc --noEmit

      - name: Unit tests
        run: bun run test

  rust-macos:
    name: Rust (macOS)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: aarch64-apple-darwin
          components: clippy

      - name: Install Opus (for audiopus_sys)
        # Same rationale as release.yml: link a native arm64 libopus via
        # pkg-config instead of compiling Opus from source.
        run: |
          set -euxo pipefail
          brew install opus pkg-config autoconf automake libtool
          ln -sf "$(brew --prefix libtool)/bin/glibtoolize" "$(brew --prefix)/bin/libtoolize"

      - name: Cache Rust
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri

      - name: Provide placeholder build inputs
        # tauri-build verifies that frontendDist and every bundle.resources
        # entry exist at compile time; the Rust check needs neither the real
        # frontend bundle nor a working ONNX Runtime, so empty stand-ins do.
        run: |
          mkdir -p dist src-tauri/onnxruntime
          touch src-tauri/onnxruntime/libonnxruntime.dylib

      - name: Clippy (deny warnings)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

  rust-windows:
    name: Rust (Windows)
    runs-on: windows-latest
    # whisper.cpp's Vulkan backend compiles a few hundred compute shaders.
    timeout-minutes: 90
    env:
      # Same as release.yml: never tune whisper.cpp to the runner's CPU.
      GGML_NATIVE: "OFF"
      # Same as release.yml: keep Cargo's intermediate artifacts (build-script
      # OUT_DIRs) on a short path. ggml builds its `vulkan-shaders-gen` host
      # tool as a nested CMake project (ExternalProject) seven directories
      # below whisper-rs-sys's OUT_DIR. Under
      # D:\a\parley\parley\src-tauri\target\<triple>\debug\build\<pkg>-<hash>
      # that project's compiler checks write files 265-277 characters long,
      # past MAX_PATH, which cl.exe's PDB writer and MSBuild's file tracker do
      # not support, so the nested configure fails with "No CMAKE_C_COMPILER
      # could be found" (ggml-org/whisper.cpp#3973). C:\b saves 29
      # characters. Final binaries stay in src-tauri/target; only the
      # intermediates move (stable `build.build-dir`, Cargo 1.91+).
      CARGO_BUILD_BUILD_DIR: 'C:\b'
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: x86_64-pc-windows-msvc
          components: clippy

      - name: Point bindgen at libclang (whisper-rs)
        # whisper-rs-sys generates its bindings with bindgen, which needs
        # libclang. The Windows image ships LLVM; pin the path so a changed
        # search order cannot silently fall back to stale bundled bindings.
        shell: bash
        run: |
          if [ -f "C:/Program Files/LLVM/bin/libclang.dll" ]; then
            echo "LIBCLANG_PATH=C:/Program Files/LLVM/bin" >> "$GITHUB_ENV"
          else
            echo "::warning::LLVM not found at C:/Program Files/LLVM; bindgen will search on its own"
          fi

      - name: Set up the Vulkan SDK (whisper.cpp GPU backend)
        # The Windows build enables whisper-rs `vulkan`; whisper-rs-sys panics
        # without VULKAN_SDK, and ggml needs glslc for its shaders.
        uses: ./.github/actions/setup-vulkan-sdk

      - name: Cache Rust
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri
          # Dependency artifacts live in the build dir now, not in target/.
          cache-directories: ${{ env.CARGO_BUILD_BUILD_DIR }}

      - name: Provide placeholder build inputs
        # Same stand-ins as the macOS job, for the Windows resource list in
        # tauri.windows.conf.json.
        run: |
          mkdir -p dist src-tauri/onnxruntime
          touch src-tauri/onnxruntime/onnxruntime.dll
          touch src-tauri/onnxruntime/onnxruntime_providers_shared.dll
        shell: bash

      # Was `cargo check` while Windows carried almost no platform-specific
      # code. Now that voice typing has a real Win32 implementation (clipboard,
      # SendInput, window styles), this job is the ONLY gate that ever compiles
      # it — nobody on the team runs Windows, so a `#[cfg(target_os =
      # "windows")]` block is invisible until CI looks at it. `--all-targets`
      # so `#[cfg(test)]` code compiles too, and `-D warnings` to match macOS:
      # an unused-unsafe or a dangling handle warning in that code is exactly
      # the kind of thing nobody would otherwise see.
      - name: Clippy (deny warnings)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --target x86_64-pc-windows-msvc -- -D warnings

      # Clippy never links, so it cannot see the one Windows-only risk of the
      # Vulkan backend: vulkan-1.dll is delay-loaded (build.rs) and a PC
      # without it must still run whisper.cpp on the CPU (vulkan_delayload.rs).
      # This links a small binary with the same linker arguments as the app and
      # builds ggml's backend registry — where ggml first calls into the DLL —
      # once with whatever this runner has and once with the loader forced
      # missing. A delay-load exception escaping ggml crashes the step.
      - name: Delay-loaded Vulkan loader (present and missing)
        shell: bash
        run: |
          set -euxo pipefail
          cargo run --manifest-path src-tauri/Cargo.toml --example vulkan_delayload_check --target x86_64-pc-windows-msvc
          PARLEY_FORCE_NO_VULKAN_LOADER=1 cargo run --manifest-path src-tauri/Cargo.toml --example vulkan_delayload_check --target x86_64-pc-windows-msvc

      # MSBuild only says "compiler identification is unknown" when a nested
      # CMake configure fails; the reason is in its configure log.
      - name: Show whisper.cpp's CMake configure logs (on failure)
        if: failure()
        shell: bash
        run: |
          find "$(cygpath -u "$CARGO_BUILD_BUILD_DIR")" -path '*whisper-rs-sys-*' -name CMakeConfigureLog.yaml 2>/dev/null |
            while read -r log; do
              echo "::group::$log"
              tail -n 200 "$log"
              echo "::endgroup::"
            done
