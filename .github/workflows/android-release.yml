name: Android Release

# Builds the signed Play bundle and publishes it.
#
# Sibling of `ios-release.yml` (design doc D5): the desktop app builds on
# `v*.*.*` tags, iOS on `ios-v*`, Android on `android-v*`. Unlike iOS — where
# TestFlight is the only deliverable — the `.aab` is also attached to a GitHub
# Release, because the Play Console is not a place contributors can look.
#
#   git tag android-v0.1.0 && git push origin android-v0.1.0
#
# Signing is the *upload* key, not the app signing key: Google holds the latter
# under Play App Signing. See android/RELEASING.md → "Signing setup" for the
# keytool invocation and the `gh secret set` commands behind every secret here.
#
# The final Play upload step is deliberately skippable. Pathors' Play account
# (ID 6541030546953107772) is still going through organization identity
# verification. That has since cleared, and the upload now authenticates through
# Workload Identity Federation rather than a service-account key: the pathors.com
# organization enforces `iam.disableServiceAccountKeyCreation`, so no JSON key
# can be minted, and punching a project-level hole in that policy to store a
# long-lived Play-publishing credential in a secret is the wrong trade when
# GitHub's OIDC token does the job with nothing at rest.
#
# A misconfiguration fails the run rather than quietly skipping the upload — a
# release that reports success without publishing is the worst kind of green.
# The one genuinely manual case, the first bundle for a package (Play refuses it
# over the API), is served by the `skip_play_upload` input, which has to be
# asked for.
#
# Runs on Linux (unlike the two macOS release workflows) because nothing here
# needs Xcode. That only works because gradle/verification-metadata.xml carries
# the `linux` classifier for com.android.tools.build:aapt2 alongside `osx` — a
# file generated on a Mac alone would fail dependency verification here.

on:
  push:
    tags:
      - "android-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build, for example android-v0.1.0"
        required: true
        type: string
      track:
        description: >-
          Play track to publish to. Overrides the PLAY_TRACK repository
          variable for this run only.
        required: false
        default: ""
        type: choice
        options: ["", "internal", "alpha", "beta", "production"]
      skip_play_upload:
        description: >-
          Build and publish the GitHub release but do NOT upload to Play.
          The one case that needs this is the first bundle for a package,
          which Play refuses over the API until a release exists in the
          console (android/RELEASING.md §7).
        required: false
        default: false
        type: boolean

# `contents` attaches the bundle to a GitHub Release; `id-token` mints the OIDC
# token that Google exchanges for a short-lived credential.
permissions:
  contents: write
  id-token: write

# Play rejects a bundle whose versionCode it has already seen, so two runs of
# the same tag racing each other end in a confusing error, not a merge conflict.
concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  release:
    name: Build, sign and publish the app bundle
    runs-on: ubuntu-latest
    timeout-minutes: 45

    # Mapped into `env` on purpose: the `secrets` context is not available in a
    # step-level `if:`, but `env` is. This is how the Play step below skips
    # itself while the service account does not yet exist.
    env:
      PLAY_UPLOAD_KEYSTORE_BASE64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_BASE64 }}
      PLAY_WIF_PROVIDER: ${{ vars.PLAY_WIF_PROVIDER }}
      PLAY_PUBLISHER_SERVICE_ACCOUNT: ${{ vars.PLAY_PUBLISHER_SERVICE_ACCOUNT }}

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      # Checked before anything is built, and before the GitHub release exists.
      # A release workflow that reports success without publishing is worse than
      # one that fails — the tag is used up, the release is half-made, and
      # nobody finds out until someone asks where the build went. Failing here
      # costs seconds and leaves nothing behind to clean up.
      #
      # Skipping is therefore something the operator asks for, not something a
      # missing secret decides. `inputs` is null on a tag push, so
      # `!inputs.skip_play_upload` is true there: a tag always has to publish.
      - name: Check this release can reach Play
        if: ${{ !inputs.skip_play_upload }}
        run: |
          if [ -z "$PLAY_WIF_PROVIDER" ] || [ -z "$PLAY_PUBLISHER_SERVICE_ACCOUNT" ]; then
            echo "::error title=Play publishing is not configured::This release cannot reach Play." \
                 "The repository variables PLAY_WIF_PROVIDER and PLAY_PUBLISHER_SERVICE_ACCOUNT must both be set" \
                 "(android/RELEASING.md §7), or re-run this workflow with skip_play_upload=true if this is the" \
                 "first bundle for the package, which Play refuses over the API until a release exists in the console."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up the Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      # A tag that disagrees with the build file ships the wrong thing under the
      # right name, and it is only noticed once the bundle sits in Play. Same
      # guard as the iOS workflow's CFBundleShortVersionString check.
      - name: Check the tag matches versionName
        run: |
          set -euo pipefail
          tag="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          want="${tag#android-v}"
          got="$(sed -nE 's/.*versionName *= *"([^"]+)".*/\1/p' android/app/build.gradle.kts | head -1)"
          code="$(sed -nE 's/.*versionCode *= *([0-9]+).*/\1/p' android/app/build.gradle.kts | head -1)"
          echo "tag=$tag  versionName=$got  versionCode=$code"
          if [ "$want" != "$got" ]; then
            echo "::error::tag $tag expects versionName $want, but app/build.gradle.kts says $got"
            exit 1
          fi

      # parleykit is pure JVM and the app's unit tests are Robolectric-free, so
      # both are cheap. There is no reason to ship a bundle whose segment logic
      # is broken.
      - name: Test
        working-directory: android
        run: ./gradlew :parleykit:test :app:testDebugUnitTest

      # Written outside the workspace so it cannot be swept into the artifact
      # upload or a later checkout, and removed in an always() step below.
      - name: Write the upload keystore
        run: |
          set -euo pipefail
          if [ -z "$PLAY_UPLOAD_KEYSTORE_BASE64" ]; then
            echo "::error::PLAY_UPLOAD_KEYSTORE_BASE64 is empty — see android/RELEASING.md"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/signing"
          chmod 700 "$RUNNER_TEMP/signing"
          printf '%s' "$PLAY_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/signing/parley-upload.keystore"
          chmod 600 "$RUNNER_TEMP/signing/parley-upload.keystore"

      - name: Build the signed bundle
        working-directory: android
        env:
          PARLEY_UPLOAD_KEYSTORE: ${{ runner.temp }}/signing/parley-upload.keystore
          PARLEY_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEYSTORE_PASSWORD }}
          PARLEY_UPLOAD_KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
          PARLEY_UPLOAD_KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
        run: ./gradlew bundleRelease

      # `signingConfig` is null when the credentials are absent and the build
      # then emits an unsigned bundle rather than failing (that fallback exists
      # for contributors — see app/build.gradle.kts). On the release path an
      # unsigned bundle is worthless, so catch it here instead of at Play.
      - name: Verify the bundle is signed
        working-directory: android
        run: |
          set -euo pipefail
          aab="app/build/outputs/bundle/release/app-release.aab"
          if unzip -l "$aab" | grep -qE 'META-INF/[^/]+\.(RSA|DSA|EC)$'; then
            echo "Bundle is signed."
          else
            echo "::error::$aab is UNSIGNED — the signing secrets did not reach Gradle"
            exit 1
          fi

      # The R8 mapping travels with the bundle: a Play crash report from this
      # build is unreadable without the mapping produced by this exact build.
      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: parley-android-${{ github.run_number }}
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Create the GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          name: Parley for Android ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          files: |
            android/app/build/outputs/bundle/release/app-release.aab
          fail_on_unmatched_files: true

      # ── Play internal track ────────────────────────────────────────────────
      # Reaching here means the precondition at the top of the job passed, so
      # either Play publishing is configured or the operator asked to skip. The
      # mapping.txt rides along so Play can deobfuscate crash reports.
      # Keyless. The OIDC token is minted for this run, exchanged for a
      # credential that impersonates the publisher service account, and expires
      # on its own; nothing long-lived exists to leak. The trust runs one way
      # and is narrow — only `pathorsAI/parley` is bound to that account.
      - name: Authenticate to Google
        id: play_auth
        if: ${{ !inputs.skip_play_upload }}
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.PLAY_WIF_PROVIDER }}
          service_account: ${{ vars.PLAY_PUBLISHER_SERVICE_ACCOUNT }}

      # Which track a tag ships to is configuration, not code: `PLAY_TRACK` moves
      # the whole pipeline from testing to production without touching this file
      # or cutting a release to change it. It stays `internal` until the app has
      # actually launched — Play refuses a production release while the store
      # listing, content rating, data safety and target-audience forms are
      # outstanding, so defaulting to production would fail every release until
      # someone finished them.
      #
      # `PLAY_USER_FRACTION` (e.g. 0.1) turns a production release into a staged
      # rollout, which is the only undo Play offers once a build is live.
      - name: Decide the track
        id: play
        if: ${{ !inputs.skip_play_upload }}
        run: |
          TRACK="${{ inputs.track }}"
          [ -n "$TRACK" ] || TRACK="${{ vars.PLAY_TRACK }}"
          [ -n "$TRACK" ] || TRACK="internal"
          FRACTION="${{ vars.PLAY_USER_FRACTION }}"
          if [ "$TRACK" = "production" ] && [ -n "$FRACTION" ]; then
            STATUS="inProgress"
          else
            STATUS="completed"
            FRACTION=""
          fi
          echo "track=$TRACK" >> "$GITHUB_OUTPUT"
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "user_fraction=$FRACTION" >> "$GITHUB_OUTPUT"
          echo "### Play release" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Track \`$TRACK\`, status \`$STATUS\`${FRACTION:+, rolling out to $FRACTION of users}." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload to Play
        if: ${{ !inputs.skip_play_upload }}
        uses: r0adkll/upload-google-play@935ef9c68bb393a8e6116b1575626a7f5be3a7fb # v1.1.3
        with:
          # The action only points GOOGLE_APPLICATION_CREDENTIALS at this file
          # and lets the Google auth library resolve it, so the external-account
          # credentials written above work exactly like a key would.
          serviceAccountJson: ${{ steps.play_auth.outputs.credentials_file_path }}
          packageName: com.pathors.parley
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          mappingFile: android/app/build/outputs/mapping/release/mapping.txt
          track: ${{ steps.play.outputs.track }}
          status: ${{ steps.play.outputs.status }}
          userFraction: ${{ steps.play.outputs.user_fraction }}

      # Deliberately loud. The run is green, so the summary is the only place
      # that says this build is not on Play yet.
      - name: Say that the Play upload was skipped on purpose
        if: ${{ inputs.skip_play_upload }}
        run: |
          {
            echo "## Play upload skipped"
            echo
            echo "This run was started with \`skip_play_upload=true\`, so the bundle is **not** on Play."
            echo "Download \`app-release.aab\` from the GitHub release and upload it in the Play Console"
            echo "(Testing → Internal testing). Every later release should go through the API —"
            echo "see \`android/RELEASING.md\` → \"Play service account\"."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning title=Not published to Play::skip_play_upload was set; upload the .aab by hand."

      - name: Remove the upload keystore
        if: always()
        run: rm -rf "$RUNNER_TEMP/signing"
