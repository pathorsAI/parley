name: Deploy website

# Builds parley.tw from `website/` and publishes it to GitHub Pages.
# `scripts/build-website.ts` renders the zh-TW home at / and the English one at
# /en/ from website/src/, and copies the rest of website/ verbatim into _site/.
# Runs on every push to main that touches the site, and can be triggered manually.

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "scripts/build-website.ts"
      - ".github/workflows/deploy-website.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress run.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      # Zero dependencies: no install step. Fails on a missing or unmatched
      # translation key rather than publishing a half-translated page.
      - name: Build site
        run: bun scripts/build-website.ts

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
