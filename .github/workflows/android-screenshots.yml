name: Android onboarding screenshots

# Boots an emulator, installs the debug build and captures every onboarding
# step in demo mode (android/scripts/onboarding-screenshots.sh), so the wizard
# can be reviewed from a PR without a local Android toolchain. Slower than
# android-ci.yml (an emulator boot), so it runs only when the onboarding UI or
# its strings change, or by hand.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "android/app/src/main/kotlin/com/pathors/parley/ui/Onboarding*.kt"
      - "android/app/src/main/kotlin/com/pathors/parley/ui/IntroStage.kt"
      - "android/app/src/main/kotlin/com/pathors/parley/screenshot/DemoMode.kt"
      - "android/app/src/main/res/values*/strings.xml"
      - "android/scripts/onboarding-screenshots.sh"
      - ".github/workflows/android-screenshots.yml"

concurrency:
  group: android-screenshots-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  capture:
    name: Capture onboarding
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up the Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Build the debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      # The emulator needs KVM on the hosted Linux runner.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # API 34: `cmd locale set-app-locales` needs 33+. Pixel 7 = 1080×2400.
      - name: Capture on an emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r android/app/build/outputs/apk/debug/*.apk
            android/scripts/onboarding-screenshots.sh screenshots

      - name: Upload the screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: onboarding-screenshots
          path: screenshots/
          retention-days: 14
