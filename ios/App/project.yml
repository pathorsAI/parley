name: Parley
options:
  bundleIdPrefix: com.pathors
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
  # Source strings are English (repo convention); Traditional Chinese is a
  # first-class translation, not an afterthought. Both have to be listed here
  # or the String Catalogs compile to English only.
  developmentLanguage: en
# knownRegions drives which localizations `Localizable.xcstrings` /
# `InfoPlist.xcstrings` actually compile into the bundle.
knownRegions: [en, zh-Hant, Base]
packages:
  ParleyKit:
    path: ../ParleyKit
targets:
  Parley:
    type: application
    platform: iOS
    sources:
      - Parley
      # The getting-started sample recording (manifest + Ogg/Opus, zh-TW and
      # en), shared with the desktop app, which serves the same files from
      # `public/`. A folder reference, so it lands in the bundle as `sample/`
      # and a re-render needs no project change. See SampleRecording.swift.
      - path: ../../public/sample
        type: folder
        buildPhase: resources
    dependencies:
      - package: ParleyKit
      # Embeds the keyboard extension into the app bundle.
      - target: ParleyKeyboard
      # Same, for the widget extension that draws the microphone Live Activity.
      # An extension that is built but not embedded is a card that never
      # appears, with nothing anywhere saying why.
      - target: ParleyActivities
    entitlements:
      path: Parley/Parley.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
        # Shared with the keyboard extension: the dictation transcript handoff
        # lives in this App Group container (see DictationChannel).
        com.apple.security.application-groups: [group.com.pathors.parley.ios]
    info:
      path: Parley/Info.plist
      properties:
        CFBundleDisplayName: Parley
        CFBundleShortVersionString: "1.21"
        CFBundleVersion: "36"
        UILaunchScreen: {}
        # Localized in Parley/InfoPlist.xcstrings; this is the fallback value.
        NSMicrophoneUsageDescription: Parley records the meeting in the room so it can transcribe it live. Audio goes only to the transcription provider tied to your account.
        UIBackgroundModes: [audio]
        # Without this key ActivityKit is not merely disabled, it is silent:
        # `ActivityAuthorizationInfo().areActivitiesEnabled` reads false and
        # `Activity.request` throws `unsupported`, with nothing on screen and
        # nothing in the log to connect that to a missing Info.plist entry. It
        # is the easiest thing in this feature to forget and the hardest to
        # diagnose afterwards, which is why it is commented and the other
        # booleans here are not.
        NSSupportsLiveActivities: true
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: com.pathors.parley.ios.auth
            CFBundleURLSchemes: [parley]
        # The Pathors faces (see Parley/ParleyTypography.swift). UIAppFonts is
        # all an app target needs — no runtime CTFontManager registration.
        # Deliberately absent from ParleyKeyboard: the keyboard extension runs
        # under a hard memory cap and draws its own minimal UI.
        UIAppFonts:
          - DMSans-Regular.ttf
          - DMSans-Medium.ttf
          - DMSans-SemiBold.ttf
          - DMSans-Bold.ttf
          - Alexandria-SemiBold.ttf
          - Alexandria-Bold.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pathors.parley.ios
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Automatic is for a developer archiving on their own Mac: Xcode holds
        # the identity and manages the profile. CI overrides this to Manual with
        # an xcconfig generated per run (.github/scripts/asc_signing.py), so the
        # committed default never has to describe a runner.
        CODE_SIGN_STYLE: Automatic
        # 科技派斯 (Pathors).
        DEVELOPMENT_TEAM: SXHVCQXJHZ
      configs:
        # Parley/DemoAudio/demo-renewal.ogg is the screenshot demo's recording
        # (ScreenshotDemo.audioURL) and every line that reads it is behind
        # `#if DEBUG`. It is excluded here rather than kept out of `sources`
        # because xcodegen has no per-configuration source list, and a resource
        # nothing in a shipped build can reach has no business being in one.
        Release:
          EXCLUDED_SOURCE_FILE_NAMES: demo-renewal.ogg

  ParleyKeyboard:
    type: app-extension
    platform: iOS
    sources: [../Keyboard]
    dependencies:
      - package: ParleyKit
    entitlements:
      path: ../Keyboard/ParleyKeyboard.entitlements
      properties:
        com.apple.security.application-groups: [group.com.pathors.parley.ios]
    info:
      path: ../Keyboard/Info.plist
      properties:
        # Localized in ../Keyboard/InfoPlist.xcstrings; this is the fallback.
        CFBundleDisplayName: Parley Voice
        CFBundleShortVersionString: "1.21"
        CFBundleVersion: "36"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            # Dictation is language-agnostic — the transcription provider
            # decides, not the key layout — so the keyboard declares itself
            # multilingual rather than Chinese-only, which is how it read to an
            # English user before.
            PrimaryLanguage: mul
            # Dictation streams audio to the Parley account for transcription,
            # so the keyboard needs Full Access (network + App Group). Without
            # it the keyboard still offers the minimal key row (App Review 4.4.1).
            RequestsOpenAccess: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pathors.parley.ios.keyboard
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: SXHVCQXJHZ

  ParleyActivities:
    type: app-extension
    platform: iOS
    sources: [../Activities]
    dependencies:
      # For MicActivityAttributes and MicActivityState. The widget cannot
      # import the app target, so the only way it and the app agree on what the
      # card says — down to the blue — is that both link this package.
      - package: ParleyKit
    entitlements:
      path: ../Activities/ParleyActivities.entitlements
      properties:
        # The same App Group as the app and the keyboard, and it is worth being
        # explicit about why an extension that never reads the container needs
        # it. This target links ParleyKit, and ParleyKit contains
        # `DictationChannel`; an extension holding a build of that which it is
        # not entitled to use is a discrepancy that would only surface the day
        # someone calls one line of it. Both halves declare the same group so
        # neither can drift. It mattered more when the card carried buttons —
        # a `LiveActivityIntent` is declared here and performed in the app's
        # process, writing exactly those mailboxes — and it is kept now that
        # they are gone because the link is what creates the hazard, not the
        # call.
        com.apple.security.application-groups: [group.com.pathors.parley.ios]
    info:
      path: ../Activities/Info.plist
      properties:
        # Localized in ../Activities/InfoPlist.xcstrings; this is the fallback.
        CFBundleDisplayName: Parley Live Activity
        CFBundleShortVersionString: "1.21"
        CFBundleVersion: "36"
        NSExtension:
          # There is no ActivityKit extension point: a Live Activity is drawn by
          # a WidgetKit extension, from the same `ActivityConfiguration` that a
          # home-screen widget would declare a `StaticConfiguration` in. And no
          # NSExtensionPrincipalClass — unlike the keyboard, the entry point is
          # the `@main` WidgetBundle the extension compiles.
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pathors.parley.ios.activities
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: SXHVCQXJHZ
    # No UIAppFonts here, for the same reason ParleyKeyboard has none: a widget
    # draws under a tight memory budget, the card is four short lines of text,
    # and the system faces are what a lock screen is already set in.
