[package]
name = "parley"
version = "0.34.6"
description = "Parley — realtime meeting copilot for interviews and negotiations"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lints.rust]
# `objc` 0.2's `msg_send!` / `class!` macros expand to `cfg(feature = "cargo-clippy")`,
# which Rust's `unexpected_cfgs` lint flags in THIS crate (the cfg is evaluated in the
# destination crate). Declare it expected so the build stays warning-clean, without
# blanket-suppressing genuinely-unexpected cfgs.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "parley_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
log = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.15"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
futures-util = "0.3"
anyhow = "1"
axum = "0.7"
uuid = { version = "1", features = ["v4"] }
# Audio framed as base64 JSON for OpenAI/Gemini realtime transcription adapters.
base64 = "0.22"
audiopus = "0.2.0"
ogg = "0.9.2"
symphonia = { version = "0.5.4", features = ["mp3", "aac", "isomp4", "flac", "pcm", "wav", "ogg", "vorbis", "alac"] }
# Audio speaker diarization: voice-embedding clustering for uploaded recordings.
# `load-dynamic` keeps ONNX Runtime OUT of link time — we ship a universal2
# `libonnxruntime.dylib` and point ORT_DYLIB_PATH at it (the only clean path for
# a `universal-apple-darwin` build). knf-rs computes kaldi fbank features (pure
# Rust C-lib, builds for both arches); ndarray 0.16 matches ort's tensor type.
# Pinned exactly: rc.11+ fail to compile their VitisAI EP against ort-sys.
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["load-dynamic", "ndarray", "std"] }
ndarray = "0.16"
knf-rs = "0.3.2"
sha2 = "0.10"
# Pure-Rust symmetric eigendecomposition for NME spectral-clustering diarization
# (no LAPACK/BLAS — keeps the no-native-deps posture of the load-dynamic ort setup).
nalgebra = "0.35"
tauri-plugin-os = "2.3.2"
# On-device speech recognition (the "local" STT provider, see local_stt.rs and
# transcription/local.rs). Builds whisper.cpp from source with CMake, and
# generates its bindings with bindgen (libclang). CPU everywhere; macOS adds
# Metal and Windows adds Vulkan below. Pinned exactly: whisper-rs tracks whisper.cpp's C API closely and
# minor bumps have broken its Rust surface before.
# `log_backend` routes whisper.cpp's own logging into `log` instead of stderr.
whisper-rs = { version = "=0.16.0", features = ["log_backend"] }

[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
# Desktop-only: routes a second app launch to the existing instance. macOS gets
# the same via RunEvent::Reopen, but Windows/Linux have no Dock semantics.
tauri-plugin-single-instance = "2"
# Launch at login (Settings › Basic, see autostart.rs). Pinned to 2.5: 2.6+
# require tauri ^2.12, and this tree is on 2.11 — taking it would drag the
# tauri crate past @tauri-apps/api 2.11, which the CLI refuses to build. Rust
# only: the webview talks to our two commands, not the plugin's JS package.
tauri-plugin-autostart = "~2.5.1"

[target.'cfg(unix)'.dependencies]
# The local STT provider's hardware probe (sysctl / host_statistics64 / statfs on
# macOS, statvfs on Linux; see hardware.rs). Already in the tree transitively.
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
coreaudio-sys = "0.2"
core-foundation = "0.10"
objc = "0.2"
block2 = "0.6"
# Adds AbandonProcessGroup to the login item's LaunchAgent (see autostart.rs).
# Already in the tree: tauri depends on it on macOS.
plist = "1"
# The local STT provider runs whisper.cpp on the GPU via Metal on macOS. Cargo
# unions this feature with the `[dependencies]` entry above for macOS only.
whisper-rs = { version = "=0.16.0", features = ["log_backend", "metal"] }

[target.'cfg(target_os = "windows")'.dependencies]
# The notification-area icon the main window hides to on close (see tray.rs).
# Windows-only on purpose: macOS keeps the Dock and gets no menu-bar icon, so
# the tray code is not even compiled there. Cargo unions this feature with the
# `[dependencies]` entry above for Windows builds only.
tauri = { version = "2", features = ["tray-icon"] }
# Microphone consent state lives in the registry capability consent store.
winreg = "0.55"
# Voice typing's native side: the Win32 clipboard, SendInput for the Ctrl+V
# chord, the foreground process's image name, and the non-activating topmost
# overlay window (see voice_typing.rs). Pinned to the 0.61 line that Tauri 2 /
# wry already pull in — a second major version of `windows` in the tree would
# make Tauri's `Window::hwnd()` return an HWND of a DIFFERENT type than the one
# these APIs accept, which does not fail until link time. Features are trimmed
# to what is actually called; QueryFullProcessImageNameW lives in Threading, so
# Win32_System_ProcessStatus is not needed. Win32_UI_Accessibility (UI
# Automation) + Win32_System_Com (the apartment and CoCreateInstance) are the
# correction watcher's field reads (see ax_observe/windows.rs).
# Win32_System_SystemInformation (GlobalMemoryStatusEx, core count),
# Win32_Storage_FileSystem (GetDiskFreeSpaceExW), Win32_Graphics_Dxgi (the GPU
# list) and Win32_System_LibraryLoader (the Vulkan loader probe and the
# delay-load hooks, see vulkan_delayload.rs) are the local STT provider's
# hardware probe (see hardware.rs).
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dxgi",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
# The local STT provider runs whisper.cpp on the GPU through ggml's Vulkan
# backend on Windows: one build for NVIDIA, AMD and Intel GPUs, with no CUDA
# runtime to ship. Building it needs the LunarG Vulkan SDK (VULKAN_SDK set,
# glslc on PATH; see CONTRIBUTING.md). The app delay-loads vulkan-1.dll (see
# build.rs and vulkan_delayload.rs) and falls back to the CPU on machines
# without a Vulkan driver. Linux is not a shipped target and stays CPU-only.
whisper-rs = { version = "=0.16.0", features = ["log_backend", "vulkan"] }

# knf-rs-sys (speaker-diarization fbank features) builds its C++ with CMake in
# Debug whenever its build script has debug assertions, which links the debug
# CRT (/MDd). whisper-rs-sys always builds Release (/MD), and MSVC refuses to
# link the two (LNK2038 RuntimeLibrary mismatch), so Windows dev builds failed
# to link. Rust itself links the release CRT, so build knf's C++ that way too.
# The package override covers the package's build script as well.
[profile.dev.package.knf-rs-sys]
debug-assertions = false
